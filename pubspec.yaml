name: pharmacy_monitor
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  open_filex: ^4.6.0
  image: ^4.5.2
  syncfusion_flutter_pdfviewer: ^28.2.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  archive: ^4.0.7
  cryptography: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
